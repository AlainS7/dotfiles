name: Bats Tests
permissions:
  contents: read

on:
  push:
    paths:
      - '**.bats'
      - '**.sh'
      - '**.zsh'
      - 'scripts/**'
      - 'xdg/.config/zsh/**'
      - 'install.sh'
      - '.github/workflows/bats.yml'
  pull_request:
    paths:
      - '**.bats'
      - '**.sh'
      - '**.zsh'
      - 'scripts/**'
      - 'xdg/.config/zsh/**'
      - 'install.sh'
      - '.github/workflows/bats.yml'

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck on .sh files
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x || true
      - name: Run ShellCheck on .zsh files (informational)
        run: |
          find . -name '*.zsh' -not -path './.git/*' -not -name '.p10k.zsh' -print0 | xargs -0 shellcheck -x --shell=bash 2>&1 || true

  test:
    name: Bats Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache npm global packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install Zsh
        run: sudo apt-get install -y zsh
      - name: Set up DOTFILES_DIR and symlinks
        run: |
          export DOTFILES_DIR="$GITHUB_WORKSPACE"
          ln -sf "$DOTFILES_DIR/xdg/.config/zsh/.zshrc" "$HOME/.zshrc"
          ln -sf "$DOTFILES_DIR/xdg/.config/zsh/.p10k.zsh" "$HOME/.p10k.zsh"
          ln -sf "$DOTFILES_DIR/zsh/.zshenv" "$HOME/.zshenv"
          echo "DOTFILES_DIR=$DOTFILES_DIR" >> $GITHUB_ENV
      - name: Install gemini CLI
        run: npm install -g @google/gemini-cli || true
      - name: Run Bats tests
        run: bats tests/
